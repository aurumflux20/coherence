name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Law smoke
        run: python -m coherence law

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Storm proof (hostile)
        run: python storm.py

      - name: Demo
        run: python -m coherence demo

      - name: Evolve demo
        run: python -m coherence evolve
