# Timely health — Nova is the fixer when RED (see docs/NOVA-HEALTH-AGENT.md)
name: Health (scheduled)

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Health (law + tests + storm)
        id: health
        run: |
          set +e
          python -m coherence health --out health-report.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat health-report.json
          exit $code

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.json

      - name: Open issue for Nova when RED
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Coherence **health RED** on scheduled run.\n\n';
            body += '**Agent:** Nova (see docs/NOVA-HEALTH-AGENT.md)\n\n';
            body += '**NEXT:**\n';
            body += '1. Download `health-report` artifact\n';
            body += '2. `python -m coherence health && python storm.py`\n';
            body += '3. Minimal fix → storm green → push\n';
            body += '4. Optional evolution lesson with proof\n\n';
            body += `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            try {
              const raw = fs.readFileSync('health-report.json', 'utf8');
              body += '\n```json\n' + raw.slice(0, 4000) + '\n```\n';
            } catch (e) {
              body += '\n_(no health-report.json)_\n';
            }
            const title = `health-red: scheduled ${new Date().toISOString().slice(0, 10)}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-red',
              per_page: 5,
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              console.log('Commented on existing health-red issue');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['health-red', 'nova-fix', 'bug'],
              });
              console.log('Opened health-red issue for Nova');
            }
