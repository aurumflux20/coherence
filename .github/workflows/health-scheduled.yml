# Timely health — runs without a human pushing code.
name: Health (scheduled)

on:
  schedule:
    # 14:00 UTC daily
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Health (law + tests + storm)
        run: python -m coherence health --out health-report.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.json

      # Surface red health without silent fail
      - name: Fail job if unhealthy
        if: failure()
        run: |
          echo "Coherence health RED — see artifact health-report.json"
          echo "NEXT: fix failing check, re-run storm, do not claim green"
          exit 1
