# Dogfood: this repo gates its own PRs with the action it ships (uses: ./).
# If the action breaks, our own CI goes red before any user's does.
name: Coherence PR check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # the sticky report comment

jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proof gate (the shipped action, from this very commit)
        uses: ./
        with:
          prove: |
            python -m unittest discover -s tests -q
            python storm.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-report
          path: coherence-report.md
